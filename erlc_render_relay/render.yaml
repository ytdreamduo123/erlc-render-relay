services:
  - type: web
    name: brisbane-erlc-relay
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DOCK_API_KEY
        sync: false
      - key: DISCORD_GUILD_ID
        value: "1515128511206002859"
      - key: ERLC_SERVER_KEY
        sync: false
